<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="https://haku777.vercel.app/files/img/utilities/yo.ico" >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Mockup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
         body {
            color-scheme: auto;
            font-family: "Inter", sans-serif;
            font-size: 2vw;
        }
        h1 {
            color: #000;
            text-align: center;
            display: inline;
            font-size: 2rem;
        }
        h1 span {
            color: #00ff80;
        }
        h1 code {
            color: crimson;
        }
        img {
            width: 17vw;
            border-radius: 10%;
        }
        a{
            text-decoration: none;
            color: #fff;
            &:hover{
                color: #00ff80;
            }
        }
        header{
            background-color: #ececec;
            padding: 10px;
            & nav{
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-direction: row;
                & a{
                    color: #000;
                }
                & input{
                    width: 30vw;
                    padding: 10px;
                    border: none;
                    border-radius: 100px;
                    box-shadow: 9px 9px 16px #a3b1c699,
                    -9px -9px 16px #ffffff80;
                }
            }
            & img{
                border-radius: 100%;
                width: 42px;
                height: 42px;
            }
        }
        main{
            background-color: #fff;
            display: flex;
            flex-direction: row;
            align-content: center;
            align-items: center;
            height: 88vh;
            & >div{
                display: flex;
                align-items: center;
                background-color: #0059ff;
                height: 100%;
                width: 20vw;
                padding: 40px;
                display: flex;
                flex-direction: column;
                gap: 100px;
                & .options{
                    display: flex;
                    flex-direction: column;
                    gap: 20px;
                }
            }
            & section{
                width: 80vw;
                height: 100%;
                display: flex;
                flex-wrap: wrap;
                align-items: start;
                justify-content: center;
                & >div{
                    & h3{
                        text-align: center;
                        color: #252525;
                    }
                    & div{
                        margin: 20px;
                        border-radius: 100%;
                        box-shadow: 9px 9px 16px #a3b1c699,
                        -9px -9px 16px #ffffff80;
                        width: 10vw;
                        height: 10vw;
                    }
                }
            }
        }
        footer{
            text-align: center;
        }
     </style>
</head>
<body>
    <header>
        <nav>
            <h1>Shop <span>SYAC</span> <code>CANADA</code></h1>
            <div><input type="research"/></div>
            <div><img src="https://github.com/haku777.png" alt="user"></div>
            <a href="#">Options</a>
        </nav>
    </header>

    <main>
        <div class="dashboard">
            <img src="https://haku777.vercel.app/files/img/utilities/tr.png" alt="">
            <div class="options">
                <a href="">Clientes</a>
                <a href="" style="color: #00ff80;">Productos</a>
                <a href="">Inventario</a>
                <a href="">Metricas</a>
                <a href="">Contacto</a>
            </div>
        </div>
        <section>
            <div>
                <div></div>
                <h3>Pedios</h3>
            </div>
            <div>
                <div></div>
                <h3>Carrito</h3>
            </div>
        </section>        
    </main>
    <footer><h2 style="background-color: teal;color: #fff">proxima edicion <span style="color: cyan">21/03/2026</span></h2></footer>
</body>
</html>
